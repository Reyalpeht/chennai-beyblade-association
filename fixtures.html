<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Tournament Fixture Generator</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#111;
    color:white;
    padding:20px;
}

h1{
    color:#ffd000;
}

textarea{
    width:100%;
    height:200px;
    margin-bottom:15px;
}

button{
    background:#ffd000;
    color:black;
    border:none;
    padding:10px 20px;
    cursor:pointer;
    font-weight:bold;
}

select{
    padding:10px;
    margin-bottom:15px;
}

.card{
    background:#222;
    padding:15px;
    margin-top:20px;
    border-radius:8px;
}

.group{
    margin-bottom:20px;
}

.fixture{
    padding:4px 0;
}
</style>
</head>
<body>

<h1>Tournament Fixture Generator</h1>

<h3>Player Names (one per line)</h3>

<textarea id="players"></textarea>

<h3>Format</h3>

<select id="format">
    <option value="auto">Auto Suggest</option>
    <option value="groups">Group Stage</option>
    <option value="swiss">Swiss</option>
    <option value="double">Double Elimination</option>
</select>

<br>

<button onclick="generateTournament()">
Generate Tournament
</button>

<div id="output"></div>

<script>

function recommendFormat(playerCount){

    if(playerCount <= 8)
        return "Single Elimination";

    if(playerCount <= 16)
        return "Double Elimination";

    if(playerCount <= 24)
        return "Swiss";

    return "Group Stage";
}

function shuffle(array){

    for(let i=array.length-1;i>0;i--){

        let j=Math.floor(Math.random()*(i+1));

        [array[i],array[j]]=[array[j],array[i]];
    }

    return array;
}

function createGroups(players){

    let groupCount = Math.ceil(players.length / 4);

    let groups = [];

    for(let i=0;i<groupCount;i++){
        groups.push([]);
    }

    players.forEach((player,index)=>{
        groups[index % groupCount].push(player);
    });

    return groups;
}

function roundRobin(group){

    let fixtures=[];

    for(let i=0;i<group.length;i++){

        for(let j=i+1;j<group.length;j++){

            fixtures.push(
                `${group[i]} vs ${group[j]}`
            );
        }
    }

    return fixtures;
}

function generateTournament(){

    let players=document
        .getElementById("players")
        .value
        .split("\n")
        .map(x=>x.trim())
        .filter(x=>x);

    let output=document.getElementById("output");

    output.innerHTML="";

    if(players.length < 4){

        output.innerHTML=
            "<div class='card'>Need at least 4 players.</div>";

        return;
    }

    shuffle(players);

    let recommendation=
        recommendFormat(players.length);

    output.innerHTML += `
    <div class="card">
        <h2>Players: ${players.length}</h2>
        <h3>Recommended Format:
        ${recommendation}</h3>
    </div>
    `;

    let groups=createGroups(players);

    let html="<div class='card'><h2>Groups</h2>";

    groups.forEach((group,index)=>{

        html += `
        <div class="group">
            <h3>Group ${String.fromCharCode(65+index)}</h3>
            <ul>
        `;

        group.forEach(player=>{

            html += `<li>${player}</li>`;
        });

        html += "</ul>";

        let fixtures=roundRobin(group);

        html += "<strong>Fixtures</strong>";

        fixtures.forEach(match=>{

            html += `
            <div class="fixture">
            ${match}
            </div>
            `;
        });

        html += "</div>";
    });

    html += "</div>";

    output.innerHTML += html;

    output.innerHTML += `
    <div class="card">
        <h2>Knockout Stage</h2>

        SF1:
        Group A Winner vs Group B Runner-Up

        <br><br>

        SF2:
        Group B Winner vs Group A Runner-Up

        <br><br>

        Final:
        Winner SF1 vs Winner SF2
    </div>
    `;
}

</script>

</body>
</html>
