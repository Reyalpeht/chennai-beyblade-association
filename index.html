<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chennai Beyblade Association</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

<style>

:root{
    --yellow:#FFD100;
    --yellow2:#F4B400;
    --black:#050505;
    --dark:#0B0B0B;
    --white:#ffffff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--black);
    color:white;
    font-family:'Rajdhani',sans-serif;
    overflow-x:hidden;
}

/* NAVBAR */

nav{
    position:sticky;
    top:0;
    width:100%;
    z-index:1000;

    background:rgba(0,0,0,0.9);
    backdrop-filter:blur(10px);

    border-bottom:2px solid var(--yellow);
}

.nav-container{

    max-width:1400px;

    margin:auto;

    padding:12px 20px;

    display:flex;

    align-items:center;

    justify-content:space-between;
}

.nav-logo{

    height:50px;

    width:auto;

    display:block;
}

.logo-link{
    display:flex;
    align-items:center;
}

.nav-links{

    display:flex;

    gap:35px;

    align-items:center;
}

.nav-links a{
    color:white;
    text-decoration:none;
    font-family:'Oswald',sans-serif;
    font-size:1.1rem;
    letter-spacing:1px;
    transition:.3s;
}

.nav-links a:hover,
.nav-links .active{
    color:var(--yellow);
    text-shadow:0 0 15px var(--yellow);
}

/* HERO */

.hero{
    min-height:65vh;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    background:
    radial-gradient(circle at center,
    rgba(255,209,0,.12),
    transparent 55%),
    #050505;
}

.hero-content{
    width:90%;
    max-width:1200px;
}

.logo{
    width:700px;
    max-width:90%;
    margin-bottom:30px;
}

.tagline{
    font-family:'Oswald',sans-serif;
    font-size:4rem;
    letter-spacing:8px;
    margin-bottom:15px;
}

.subtitle{
    font-size:1.5rem;
    color:#ccc;
    margin-bottom:40px;
}

.hero-buttons{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

.btn-yellow{
    background:var(--yellow);
    color:black;

    padding:18px 40px;

    text-decoration:none;

    font-weight:bold;
    font-size:1.2rem;

    border:2px solid var(--yellow);

    transition:.3s;
}

.btn-yellow:hover{
    transform:translateY(-4px);
    box-shadow:0 0 25px var(--yellow);
}

.btn-outline{
    border:2px solid var(--yellow);
    color:white;

    padding:18px 40px;

    text-decoration:none;
    font-weight:bold;
    font-size:1.2rem;

    transition:.3s;
}

.btn-outline:hover{
    background:var(--yellow);
    color:black;
}

/* STATS */

.stats{
    padding:80px 20px;
}

.stats-container{
    max-width:1200px;
    margin:auto;

    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
}

.stat-card{
    border:2px solid var(--yellow);
    padding:40px;
    text-align:center;

    background:#0A0A0A;
}

.stat-number{
    color:var(--yellow);
    font-size:4rem;
    font-weight:bold;
}

.stat-title{
    font-size:1.3rem;
}

/* TOURNAMENT */

.featured{
    max-width:1400px;
    margin:auto;
    padding:60px 20px;
}

.section-title{
    color:var(--yellow);
    font-size:2rem;
    margin-bottom:20px;
}

.featured-card{

    border:2px solid var(--yellow);

    padding:50px;

    background:
    linear-gradient(
    135deg,
    rgba(255,209,0,.08),
    rgba(0,0,0,.85));

    transition:.3s;
}

.featured-card:hover{

    box-shadow:
    0 0 30px rgba(255,209,0,.25);

}

.featured-card h2{
    font-size:4rem;
    margin-bottom:20px;
    color:var(--yellow);
    font-family:'Oswald',sans-serif;
    letter-spacing:2px;
}

.featured-card p{
    font-size:1.3rem;
    color:#ccc;
    margin-bottom:20px;
}

/* FOOTER */

footer{
    margin-top:80px;
    border-top:2px solid var(--yellow);

    text-align:center;
    padding:30px;
}

footer p{
    color:#aaa;
}

/* MOBILE */

@media(max-width:900px){

.nav-links{
    gap:20px;
    flex-wrap:wrap;
}

.tagline{
    font-size:2rem;
}

.stats-container{
    grid-template-columns:1fr;
}

.featured-card h2{
    font-size:2.5rem;
}

}

</style>
</head>

<body>

<nav>

<div class="nav-container">

<a href="index.html" class="logo-link">
    <img src="cba-logo.png" alt="CBA Logo" class="nav-logo">
</a>

<div class="nav-links">
    <a href="index.html" class="active">HOME</a>
    <a href="tournaments.html">TOURNAMENTS</a>
    <a href="rankings.html">RANKINGS</a>
    <a href="statistics.html">STATISTICS</a>
    <a href="gallery.html">GALLERY</a>
    <a href="rules.html">RULES</a>
</div>

</div>

</nav>

<section class="hero">

<div class="hero-content">

<h1 class="tagline">
COMPETE • RANK • DOMINATE
</h1>

<p class="subtitle">
Official Home of Competitive Beyblade X in Chennai
</p>

<div class="hero-buttons">
<a href="tournaments.html" class="btn-yellow">UPCOMING TOURNAMENTS</a>
<a href="rankings.html" class="btn-outline">CURRENT RANKINGS</a>
</div>

</div>

</section>

<section class="stats">

<div class="stats-container">

<div class="stat-card">
    <div class="stat-number" id="totalTournaments">0</div>
    <div class="stat-title">TOURNAMENTS</div>
</div>

<div class="stat-card">
    <div class="stat-number" id="totalPlayers">0</div>
    <div class="stat-title">REGISTERED PLAYERS</div>
</div>

<div class="stat-card">
    <div class="stat-number" id="totalMatches">0</div>
    <div class="stat-title">MATCHES PLAYED</div>
</div>
    
</div>

</section>

<section class="featured">

<h2 class="section-title">
FEATURED TOURNAMENT
</h2>

<div id="featuredTournament"></div>

</section>

<footer>

<p>
© 2026 Chennai Beyblade Association
</p>

</footer>

<script>

/****************************
CSV URLS
****************************/

const statsCsv = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRnAT-fx54Sgm1C-CIyXTjIEd0ASWGafVkcvuL4FXo09oL2ONFcE3TU5MW4um4oG5indzC28v1a1cZT/pub?gid=1296709056&single=true&output=csv";
const tournamentsCsv = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRnAT-fx54Sgm1C-CIyXTjIEd0ASWGafVkcvuL4FXo09oL2ONFcE3TU5MW4um4oG5indzC28v1a1cZT/pub?gid=0&single=true&output=csv";

/****************************
HELPER
****************************/

function clean(value){
    return (value || "")
        .replace(/"/g,"")
        .trim();
}

/****************************
SITE STATS
****************************/

fetch(statsCsv)
.then(r => r.text())
.then(csv => {

    const rows = csv
        .split(/\r?\n/)
        .filter(row => row.trim() !== "");

    if(rows.length < 2) return;

    const cols = rows[1].split(",");

    document.getElementById("totalTournaments").textContent =
        clean(cols[0]);

    document.getElementById("totalPlayers").textContent =
        clean(cols[1]);

    document.getElementById("totalMatches").textContent =
        clean(cols[2]);

})
.catch(err => console.error("Site Stats Error:", err));

/****************************
FEATURED TOURNAMENT
****************************/

fetch(tournamentsCsv)
.then(r => r.text())
.then(csv => {

    const rows = csv
        .split(/\r?\n/)
        .filter(row => row.trim() !== "");

    rows.shift();

    let featuredTournament = null;

    rows.forEach(row => {

        const cols = row.split(",");

        const tournament = {

            id: clean(cols[0]),
            name: clean(cols[1]),
            date: clean(cols[2]),
            venue: clean(cols[3]),
            format: clean(cols[4]),
            status: clean(cols[5]),
            participants: clean(cols[6])
            registrationLink: clean(cols[10])

        };

        if(
            !featuredTournament &&
            tournament.status.toLowerCase() === "upcoming"
        ){
            featuredTournament = tournament;
        }

    });

    if(featuredTournament){

        document.getElementById(
            "featuredTournament"
        ).innerHTML = `

        <div class="featured-card">

    <h2>${featuredTournament.name}</h2>

    <p><strong>📅 Date:</strong> ${featuredTournament.date}</p>

    <p><strong>📍 Venue:</strong> ${featuredTournament.venue}</p>

    <p><strong>⚔ Format:</strong> ${featuredTournament.format}</p>

<!--
    <p><strong>👥 Players:</strong> ${featuredTournament.participants}</p>
-->
    <br>

    <a href="tournament.html?id=${featuredTournament.id}"
   class="btn-yellow">
   VIEW TOURNAMENT
</a>

<a href="${featuredTournament.registrationLink}"
   target="_blank"
   class="btn-outline"
   style="margin-left:15px;">
   REGISTER
</a>

</div>
        `;
    }

})
.catch(err => console.error("Tournament Error:", err));

</script>

</body>
</html>
