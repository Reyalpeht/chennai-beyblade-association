<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rankings | Chennai Beyblade Association</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

<style>

:root{
    --yellow:#FFD100;
    --black:#050505;
    --card:#0d0d0d;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#050505;
    color:white;
    font-family:'Rajdhani',sans-serif;
}

/* NAVBAR */

nav{
    position:sticky;
    top:0;
    z-index:999;
    background:rgba(0,0,0,.95);
    border-bottom:2px solid var(--yellow);
}

.nav-container{
    max-width:1400px;
    margin:auto;
    padding:20px;
}

.nav-links{
    display:flex;
    justify-content:center;
    gap:50px;
}

.nav-links a{
    text-decoration:none;
    color:white;
    font-family:'Oswald',sans-serif;
}

.nav-links a:hover,
.nav-links .active{
    color:var(--yellow);
}

/* HERO */

.hero{
    text-align:center;
    padding:80px 20px;
    background:
    radial-gradient(circle at center,
    rgba(255,209,0,.15),
    transparent 60%);
}

.hero h1{
    color:var(--yellow);
    font-size:5rem;
    font-family:'Oswald',sans-serif;
}

.hero p{
    letter-spacing:4px;
}

/* PODIUM */

.podium{
    max-width:1200px;
    margin:auto;
    padding:40px 20px;

    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:20px;
}

.podium-card{
    background:var(--card);
    border:2px solid var(--yellow);
    text-align:center;
    padding:30px;
}

.first{
    transform:translateY(-20px);
}

.place{
    font-size:3rem;
}

.blader{
    font-size:2rem;
    margin-top:15px;
}

.points{
    color:var(--yellow);
    font-size:1.5rem;
}

/* TABLE */

.section{
    max-width:1200px;
    margin:auto;
    padding:40px 20px;
}

.section-title{
    color:var(--yellow);
    font-size:2rem;
    margin-bottom:20px;
    font-family:'Oswald',sans-serif;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:var(--yellow);
    color:black;
    padding:15px;
}

td{
    padding:15px;
    border-bottom:1px solid rgba(255,255,255,.1);
}

tr:hover{
    background:#111;
}

/* FOOTER */

footer{
    margin-top:80px;
    border-top:2px solid var(--yellow);
    text-align:center;
    padding:30px;
}

/* MOBILE */

@media(max-width:768px){

.hero h1{
    font-size:3rem;
}

.podium{
    grid-template-columns:1fr;
}

.first{
    transform:none;
}

.nav-links{
    flex-wrap:wrap;
    gap:20px;
}

}

</style>
</head>

<body>

<nav>
<div class="nav-container">
<div class="nav-links">
<a href="index.html">HOME</a>
<a href="tournaments.html">TOURNAMENTS</a>
<a href="rankings.html" class="active">RANKINGS</a>
<a href="statistics.html">STATISTICS</a>
<a href="gallery.html">GALLERY</a>
<a href="rules.html">RULES</a>
</div>
</div>
</nav>

<section class="hero">
<h1>RANKINGS</h1>
<p>THE BEST OF CHENNAI</p>
</section>

<section class="podium" id="podium">
</section>

<section class="section">

<h2 class="section-title">
LEADERBOARD
</h2>

<table>

<thead>
<tr>
<th>Rank</th>
<th>Blader</th>
<th>Points</th>
</tr>
</thead>

<tbody id="leaderboard">
</tbody>

</table>

</section>

<footer>
<p>© Chennai Beyblade Association</p>
</footer>

<script>

const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRnAT-fx54Sgm1C-CIyXTjIEd0ASWGafVkcvuL4FXo09oL2ONFcE3TU5MW4um4oG5indzC28v1a1cZT/pub?gid=941651049&single=true&output=csv";

fetch(csvUrl)
.then(response => response.text())
.then(csv => {

    const rows = csv.trim().split("\n");

    rows.shift();

    let tableHTML = "";

    let top3 = [];

    rows.forEach(row => {

        const cols = row.split(",");

        const rank = cols[0];
        const blader = cols[1];
        const points = cols[2];

        if(rank <= 3){

            top3.push({
                rank,
                blader,
                points
            });
        }

        tableHTML += `
        <tr>
            <td>${rank}</td>
            <td>${blader}</td>
            <td>${points}</td>
        </tr>
        `;

    });

    document.getElementById("leaderboard").innerHTML = tableHTML;

    let podiumHTML = "";

    const order = [1,0,2];

    order.forEach(i => {

        if(top3[i]){

            const p = top3[i];

            podiumHTML += `
            <div class="podium-card ${p.rank == 1 ? 'first' : ''}">

                <div class="place">
                ${p.rank == 1 ? '🥇' :
                  p.rank == 2 ? '🥈' : '🥉'}
                </div>

                <div class="blader">
                ${p.blader}
                </div>

                <div class="points">
                ${p.points} Points
                </div>

            </div>
            `;
        }

    });

    document.getElementById("podium").innerHTML = podiumHTML;

});

</script>

</body>
</html>
